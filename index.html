let questions=[];
subjects.forEach(s=>s.q.forEach(q=>questions.push({...{subject:s.name},q:q[0],opts:q[1],ans:q[2]})));

let current=0;
let answers={};

function show(){
let q=questions[current];
document.getElementById("progress").innerText=
"प्रश्न "+(current+1)+" / "+questions.length+" | "+q.subject;
document.getElementById("question").innerText=q.q;
let html="";
q.opts.forEach((o,i)=>{
html+=`<button class="option ${answers[current]===i?'selected':''}" onclick="choose(${i})">${"ABCD"[i]}. ${o}</button>`;
});
document.getElementById("options").innerHTML=html;
}
function choose(i){answers[current]=i;show()}
function next(){if(current<questions.length-1){current++;show()}}
function previous(){if(current>0){current--;show()}}
function finish(){
let score=0,review="";
questions.forEach((q,i)=>{
if(answers[i]===q.ans)score++;
review+=`<p><b>${i+1}. ${q.q}</b><br>सही उत्तर: ${q.opts[q.ans]}<br>आपका उत्तर: ${answers[i]===undefined?"नहीं दिया":q.opts[answers[i]]}</p><hr>`;
});
document.getElementById("quiz").style.display="none";
document.getElementById("result").style.display="block";
